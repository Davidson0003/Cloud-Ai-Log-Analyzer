<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Security Visualization Dashboard</title>

<link rel="stylesheet" href="/static/css/hacker.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:30px;
}

.card{
border:1px solid #00ff9c;
padding:20px;
text-align:center;
box-shadow:0 0 15px #00ff9c55;
}

/* LOG SECTION */

.log-container{
margin-top:40px;
border:1px solid #00ff9c;
padding:20px;
box-shadow:0 0 20px #00ff9c55;
}

.log-box{
background:black;
height:300px;
overflow-y:auto;
padding:10px;
font-family:monospace;
border:1px solid #00ff9c;
}

/* COLORS */

.log-line{
margin-bottom:5px;
}

.info{
color:#00ff9c;
}

.warn{
color:yellow;
}

.error{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 SECURITY VISUALIZATION DASHBOARD</h1>

<div class="grid">

<!-- Risk Chart -->
<div class="card">
<h3>Risk Score</h3>
<canvas id="riskChart"></canvas>
</div>

<!-- Error vs Warning -->
<div class="card">
<h3>Error vs Warning</h3>
<canvas id="barChart"></canvas>
</div>

<!-- Distribution -->
<div class="card">
<h3>Log Distribution</h3>
<canvas id="pieChart"></canvas>
</div>

</div>


<!-- 🔥 LOG VIEWER SECTION -->
<div class="log-container">

<h2>📜 LIVE LOG MONITOR</h2>

<div class="log-box" id="logBox"></div>

</div>

<br>

<a href="/analysis"><button>⬅ Back</button></a>

</div>

<script>

// GET DATA
const data = JSON.parse(localStorage.getItem("analysis"));

if(data){

// ---------------- CHARTS ----------------

// RISK CHART
new Chart(document.getElementById("riskChart"), {
type: "doughnut",
data: {
labels: ["Risk", "Safe"],
datasets: [{
data: [data.summary.risk_score, 100 - data.summary.risk_score],
backgroundColor: ["red", "#00ff9c"]
}]
}
});

// BAR CHART
new Chart(document.getElementById("barChart"), {
type: "bar",
data: {
labels: ["Errors", "Warnings"],
datasets: [{
label: "Logs",
data: [data.stats.errors, data.stats.warnings],
backgroundColor: ["red", "yellow"]
}]
}
});

// PIE CHART
new Chart(document.getElementById("pieChart"), {
type: "pie",
data: {
labels: ["Errors", "Warnings", "Info"],
datasets: [{
data: [
data.stats.errors,
data.stats.warnings,
data.stats.info
],
backgroundColor: ["red", "yellow", "#00ff9c"]
}]
}
});


// ---------------- LOG DISPLAY ----------------

const logBox = document.getElementById("logBox");

// 🔥 IMPORTANT: must come from backend
if(data.logs){

data.logs.forEach(log => {

let className = "info";

if(log.level === "ERROR"){
className = "error";
}
else if(log.level === "WARNING"){
className = "warn";
}

logBox.innerHTML += `
<div class="log-line ${className}">
[${log.timestamp}] ${log.level} - ${log.message}
</div>
`;

});

}

}

</script>

</body>
</html>
