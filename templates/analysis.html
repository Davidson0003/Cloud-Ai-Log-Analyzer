<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>AI Security Analysis</title>

<link rel="stylesheet" href="/static/css/hacker.css">

<style>

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

.card{
border:1px solid #00ff9c;
padding:20px;
text-align:center;
box-shadow:0 0 15px #00ff9c55;
}

.card h2{
font-size:28px;
}

/* STATUS */
.status{
display:flex;
gap:20px;
margin-top:20px;
}

.status div{
border:1px solid #00ff9c;
padding:10px;
flex:1;
text-align:center;
}

/* TERMINAL */
.terminal{
background:black;
color:#00ff9c;
font-family:monospace;
padding:15px;
height:150px;
overflow:auto;
border:1px solid #00ff9c;
}

/* ALERT UPGRADE */
.alert-box{
margin-top:20px;
padding:20px;
border:2px solid red;
box-shadow:0 0 20px red;
animation: blink 1s infinite alternate;
}

@keyframes blink{
from{opacity:0.7;}
to{opacity:1;}
}

.alert-critical{
border-color:red;
box-shadow:0 0 20px red;
}

.alert-high{
border-color:orange;
box-shadow:0 0 20px orange;
}

.alert-normal{
border-color:green;
box-shadow:0 0 20px green;
}

</style>

</head>

<body>

<div class="container">

<h1>☠ AI SECURITY OPERATIONS CENTER ☠</h1>

<!-- METRICS -->
<div class="grid">

<div class="card">
<h3>Total Logs</h3>
<h2 id="totalLogs">0</h2>
</div>

<div class="card">
<h3>Errors</h3>
<h2 id="errors">0</h2>
</div>

<div class="card">
<h3>Warnings</h3>
<h2 id="warnings">0</h2>
</div>

<div class="card">
<h3>Risk Level</h3>
<h2 id="riskLevel">LOW</h2>
</div>

</div>

<!-- STATUS -->
<div class="status">

<div>
<h3>System Status</h3>
<p id="systemStatus">Monitoring</p>
</div>

<div>
<h3>Anomaly Detection</h3>
<p id="anomalyStatus">None</p>
</div>

<div>
<h3>Threat Level</h3>
<p id="threatStatus">Safe</p>
</div>

</div>

<!-- TERMINAL -->
<h2 style="margin-top:40px;">🧠 AI Security Console</h2>

<div class="terminal" id="terminal"></div>

<!-- 🔥 ADVANCED ALERT -->
<div id="alertBox" class="alert-box">
<h2>🚨 AI THREAT ALERT SYSTEM 🚨</h2>
<p id="alertMessage"></p>
</div>

<br>

<a href="/charts"><button>VIEW CHARTS →</button></a>
<a href="/index"><button>⬅ BACK</button></a>

</div>

<script>

const data = JSON.parse(localStorage.getItem("analysis"));

if(data){

// METRICS
document.getElementById("totalLogs").innerText = data.stats.total_logs;
document.getElementById("errors").innerText = data.stats.errors;
document.getElementById("warnings").innerText = data.stats.warnings;
document.getElementById("riskLevel").innerText = data.summary.risk_level;

// STATUS
if(data.summary.is_anomaly){
document.getElementById("anomalyStatus").innerText="Detected";
document.getElementById("threatStatus").innerText=data.summary.risk_level;
document.getElementById("systemStatus").innerText="Under Risk";
}
else{
document.getElementById("anomalyStatus").innerText="None";
document.getElementById("threatStatus").innerText="Safe";
document.getElementById("systemStatus").innerText="Stable";
}

// TERMINAL ANIMATION
const terminal = document.getElementById("terminal");

const logs = [
"Initializing AI security engine...",
"Scanning uploaded logs...",
"Parsing log patterns...",
"Detecting anomalies...",
"Calculating risk score...",
"Generating threat intelligence...",
data.explanation
];

let i=0;

function typeLine(){
if(i<logs.length){
terminal.innerHTML += logs[i] + "<br>";
terminal.scrollTop = terminal.scrollHeight;
i++;
setTimeout(typeLine,700);
}
}
typeLine();

// 🔥 ALERT SYSTEM
const alertBox = document.getElementById("alertBox");
const alertMessage = document.getElementById("alertMessage");

alertMessage.innerText = data.alert.message;

if(data.alert.severity === "Critical"){
alertBox.classList.add("alert-critical");
}
else if(data.alert.severity === "High"){
alertBox.classList.add("alert-high");
}
else{
alertBox.classList.add("alert-normal");
}

}

</script>

</body>
</html>
